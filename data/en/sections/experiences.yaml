  positions:
  - designation: Senior Network and Security Engineer
    start: Jan 2026
    responsibilities:
    - "Researcher for EU-funded programmes: [XTRUST-6G](https://cordis.europa.eu/project/id/101192749), [SALUS](https://cordis.europa.eu/project/id/101225719), [CASTOR](https://cordis.europa.eu/project/id/101167904), [ENFORCE](https://enforceproject.eu/), [IRONPLAN EDF](https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/projects-details/44181033/101224513/EDF), [SECASSURED](https://cordis.europa.eu/project/id/101225858), [CIPHER](https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/projects-details/43152860/101249732/DIGITAL), [CIRCAT](https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/projects-details/43152860/101249750/DIGITAL), [SecQdevOps](https://cordis.europa.eu/project/id/101225776)."
